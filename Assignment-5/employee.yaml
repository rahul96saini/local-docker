apiVersion: v1
kind: Pod
metadata:
  name: empms-employee
  labels:
    app: empms-employee
spec:
  containers:
    - name: employee
      image: ot-microservices-empms-employee:latest
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 8083
      env:
        - name: CONFIG_FILE
          value: "/app/config.yaml"
        - name: ELASTIC_APM_ENABLED
          value: "false"
      volumeMounts:
        - name: employee-config
          mountPath: /app/config.yaml
          subPath: config.yaml
  volumes:
    - name: employee-config
      configMap:
        name: employee-config
---
apiVersion: v1
kind: Service
metadata:
  name: empms-employee
spec:
  selector:
    app: empms-employee
  ports:
    - port: 8083
      targetPort: 8083
  type: ClusterIP
