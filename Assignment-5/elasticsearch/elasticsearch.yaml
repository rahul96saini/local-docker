
apiVersion: v1
kind: Pod
metadata:
  name: empms-es
  labels:
    app: empms-es
spec:
  containers:
    - name: elasticsearch
      image: ot-microservices-empms-es:latest
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 9200
        - containerPort: 9300
      env:
        - name: ES_JAVA_OPTS
          value: "-Xms512m -Xmx512m"
        - name: ELASTIC_PASSWORD
          value: "elastic"
      volumeMounts:
        - name: es-config
          mountPath: /usr/share/elasticsearch/config/elasticsearch.yml
          subPath: elasticsearch.yml
  volumes:
    - name: es-config
      configMap:
        name: elasticsearch-config
---
apiVersion: v1
kind: Service
metadata:
  name: empms-es
spec:
  selector:
    app: empms-es
  ports:
    - name: http
      port: 9200
      targetPort: 9200
    - name: transport
      port: 9300
      targetPort: 9300
  type: ClusterIP
